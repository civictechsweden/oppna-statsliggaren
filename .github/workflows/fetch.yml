name: Fetch the data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 1AM UTC every night

permissions:
  contents: write

concurrency:
  group: publish-statsliggaren
  cancel-in-progress: false

jobs:
  scrape:
    name: Fetch the data
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO_ID: ${{ vars.HF_DATASET_REPO_ID || secrets.HF_DATASET_REPO_ID }}
      USE_IP_ROTATOR: ${{ vars.USE_IP_ROTATOR }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - run: uv sync --frozen

      - name: Validate publication configuration
        run: |
          test -n "$HF_TOKEN" || { echo "HF_TOKEN secret is required"; exit 1; }
          test -n "$HF_DATASET_REPO_ID" || { echo "HF_DATASET_REPO_ID variable or secret is required"; exit 1; }

      - name: Fetch the data
        id: fetch
        run: |
          refresh_start="$(($(date -u +%Y) - 1))-01-01"
          if [ "$(date -u +%u)" = "7" ]; then
            uv run -m run --refresh-since "$refresh_start" --scan-all-gaps --repo-id "$HF_DATASET_REPO_ID"
          else
            uv run -m run --refresh-since "$refresh_start" --repo-id "$HF_DATASET_REPO_ID"
          fi
          if jq -e '.conversions | length > 0' letters/source_files.json >/dev/null; then
            echo 'office_needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Office conversion tools
        if: steps.fetch.outputs.office_needed == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc

      - name: Convert legacy attachments
        if: steps.fetch.outputs.office_needed == 'true'
        run: uv run -m run --convert-attachments

      - name: Publish dataset
        run: uv run -m scripts.build_letters_parquet --output letters.parquet --upload --repo-id "$HF_DATASET_REPO_ID" --repo-path letters.parquet

      - name: Commit and push
        run: |
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global user.name 'github-actions[bot]'
          git add letters.csv attachments.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update the data'
            git push
          fi
