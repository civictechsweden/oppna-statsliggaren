name: Fetch the data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 1AM UTC every night

permissions:
  contents: write

jobs:
  scrape:
    name: Fetch the data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - run: uv sync --frozen

      - name: Fetch the data
        env:
          USE_IP_ROTATOR: ${{ vars.USE_IP_ROTATOR }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: uv run python run.py

      - name: Build and upload letters parquet
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO_ID: ${{ vars.HF_DATASET_REPO_ID }}
        if: ${{ env.HF_DATASET_REPO_ID != '' && env.HF_TOKEN != '' }}
        run: uv run python scripts/build_letters_parquet.py --output letters.parquet --repo-id "$HF_DATASET_REPO_ID" --repo-path data/letters.parquet

      - name: Commit and push
        run: |
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global user.name 'github-actions[bot]'
          git add letters.csv attachments.csv
          git commit -m 'Update the data' || echo "Nothing to commit"
          git push
